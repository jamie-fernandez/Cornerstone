include:
  # GitLab-managed security scanners. Findings surface as reports in the MR
  # security widget; the jobs don't fail the pipeline on findings.
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - setup
  - lint
  - test
  - build
  - release
  - renovate

default:
  # Auto-cancel superseded pipelines when a newer commit lands on the same ref.
  interruptible: true

# ---------- Reusable config ----------

# Python jobs: cache uv's download cache (keyed on the lockfile) so `uv sync`
# only downloads what changed between lockfile updates.
.python-base:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

# Frontend jobs: cache node_modules (keyed on the lockfile).
.frontend-base:
  image: oven/bun:1.3
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules

# Path filters: jobs skip when the MR/push doesn't touch their stack.
.python-paths: &python-paths
  - app/**/*
  - cli/**/*
  - start.py
  - pyproject.toml
  - uv.lock
  - Cornerstone.spec
  - .gitlab-ci.yml

.frontend-paths: &frontend-paths
  - ui/**/*
  - cypress/**/*
  - public/**/*
  - index.html
  - package.json
  - bun.lock
  - biome.json
  - vite.config.js
  - vitest.config.js
  - cypress.config.js
  - .gitlab-ci.yml

# Standard triggers. `push`/`web` sources only — scheduled pipelines are
# renovate-only, so lint/test/build never fire on the dependency-update schedule.
.python-rules: &python-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *python-paths
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"
    changes: *python-paths

.frontend-rules: &frontend-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *frontend-paths
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"
    changes: *frontend-paths

# ---------- Jobs ----------

merge-request:setup:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  stage: setup
  script:
    - python .gitlab/merge-request-setup.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:python:
  extends: .python-base
  stage: lint
  needs: [] # Start immediately; no job outputs are needed from earlier stages.
  rules: *python-rules
  script:
    - uv sync --locked
    - uv run ruff check .

lint:frontend:
  extends: .frontend-base
  stage: lint
  needs: []
  rules: *frontend-rules
  script:
    - bun install --frozen-lockfile
    - bun x biome check .

# Audit the full locked dependency set (incl. dev) against the PyPA advisory DB.
audit:python:
  extends: .python-base
  stage: lint
  needs: []
  rules: *python-rules
  script:
    - uv export --locked --no-emit-project --format requirements-txt > /tmp/requirements.txt
    - uvx pip-audit --requirement /tmp/requirements.txt

test:python:
  extends: .python-base
  stage: test
  needs: []
  rules: *python-rules
  # Parsed from pytest-cov's term output for the MR coverage badge.
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: pytest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  script:
    - uv sync --locked
    - uv run pytest app/__tests__/ cli/__tests__/ --cov=app --cov=cli --cov-report=term --cov-report=xml --junitxml=pytest-junit.xml

test:frontend:
  extends: .frontend-base
  stage: test
  needs: []
  rules: *frontend-rules
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: vitest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  script:
    - bun install --frozen-lockfile
    - bun run test:ui:unit -- run --coverage --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml

# Cypress E2E against a production build (vite preview).
# Image version must match devDependencies.cypress so the baked-in binary is used.
test:e2e:
  image:
    name: cypress/included:15.19.0
    # The image sets ENTRYPOINT ["cypress"]; without this reset, the runner's
    # shell script would be passed to the cypress binary as arguments.
    entrypoint: [""]
  stage: test
  needs: []
  rules: *frontend-rules
  variables:
    CYPRESS_INSTALL_BINARY: "0" # Binary is already baked into the image.
    # In containers, localhost often resolves to ::1 while wait-on connects via
    # IPv4 (ECONNREFUSED). ipv4first makes vite preview and wait-on agree on 127.0.0.1.
    # Chrome (Cypress) does its own loopback fallback and is unaffected.
    NODE_OPTIONS: "--dns-result-order=ipv4first"
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - cypress/screenshots/
      - cypress/videos/
  script:
    # The image ships Node.js; installing bun through npm avoids needing curl/unzip.
    - npm install --global bun
    - bun install --frozen-lockfile
    - bun run test:ui:e2e

# Dry-run production builds: verify the app builds on every push, per OS.
# No `artifacts:` key on purpose — build output is discarded with the runner.
# macOS is built manually on a local Mac (hosted macOS runners need a paid tier).
.dry-run:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"

build:dry-run:linux:
  extends: .dry-run
  image: oven/bun:1.3
  variables:
    UV_CACHE_DIR: .uv-cache
    # Keep uv's managed CPython inside the cached dir — the bun image has no
    # system Python, so uv downloads one; caching avoids re-downloading per run.
    UV_PYTHON_INSTALL_DIR: .uv-cache/python
  cache:
    - key:
        files:
          - bun.lock
      paths:
        - node_modules
    - key:
        files:
          - uv.lock
      paths:
        - .uv-cache
  script:
    # binutils provides objdump, which PyInstaller requires on Linux;
    # ca-certificates is missing from the bun image and curl needs it for TLS.
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates binutils
    # uv is a single static binary — cheaper to install here than bun is in the uv image.
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    # --ignore-scripts skips lifecycle scripts (e.g. Cypress's postinstall, which
    # the build doesn't need); build-critical native deps ship prebuilt binaries.
    - bun install --frozen-lockfile --ignore-scripts
    - uv sync --locked
    # Run the build steps directly (not `python3 commands/build.py`) so each
    # step's output stays explicit in the job log.
    - bun run vite build
    - uv run python -m cli.commands.build_pyinstaller

# Windows hosted runner uses PowerShell and can't set `image:`.
# Manual + allow_failure: hosted Windows runners require a paid tier; if no
# runner picks this up, a blocking auto job would leave pipelines pending forever.
# Run it manually to verify a Windows build when touching build config.
build:dry-run:windows:
  extends: .dry-run
  when: manual
  allow_failure: true
  tags:
    - saas-windows-medium-amd64
  script:
    - irm bun.sh/install.ps1 | iex
    - irm https://astral.sh/uv/install.ps1 | iex
    - $env:Path = "$env:USERPROFILE\.bun\bin;$env:USERPROFILE\.local\bin;$env:Path"
    # --ignore-scripts avoids Cypress's postinstall, which crashes under bun on Windows.
    - bun install --frozen-lockfile --ignore-scripts
    - uv sync --locked
    - bun run vite build
    - uv run python -m cli.commands.build_pyinstaller

# Release builds run on version tags (e.g. `git tag v1.2.0`): same build as the
# dry-run, but the output is kept and attached to a GitLab Release.
# Note: GitLab keeps the latest successful pipeline's artifacts per ref by
# default, so the newest release's download link survives expire_in; older ones
# eventually lapse. Upload to the package registry if permanence is needed.
build:release:linux:
  extends: build:dry-run:linux
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  # Don't let a newer pipeline cancel a release mid-creation.
  interruptible: false
  needs:
    - build:release:linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Cornerstone (Linux x86_64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:release:linux"
          link_type: package

# Renovate dependency updates for GitLab.
# Runs the official renovate image as a scheduled (or manual) pipeline; config lives in renovate.json.
renovate:
  image: renovate/renovate:44
  stage: renovate
  needs: [] # Self-contained; don't wait on other stages in manual web pipelines.
  interruptible: false
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_TOKEN: $SETTINGS__GITLAB_ACCESS_TOKEN
    GITHUB_COM_TOKEN: $SETTINGS__GITHUB_ACCESS_TOKEN
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# The included security templates run on scheduled pipelines too (they match on
# $CI_COMMIT_BRANCH, which schedules set). Override their rules so schedules stay
# renovate-only. If a template ever renames these jobs, this block becomes a
# scriptless job and pipeline creation fails loudly — delete the stale override.
secret_detection:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"

semgrep-sast:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"
