# Renovate dependency updates for GitLab.
# Runs the official renovate image as a scheduled (or manual) pipeline; config lives in renovate.json.
renovate:
  image: renovate/renovate:latest
  stage: renovate
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_TOKEN: $SETTINGS__GITLAB_ACCESS_TOKEN
    GITHUB_COM_TOKEN: $SETTINGS__GITHUB_ACCESS_TOKEN
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
