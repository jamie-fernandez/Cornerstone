workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - setup
  - lint
  - test
  - renovate

merge-request:setup:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: setup
  script:
    - python .gitlab/merge-request-setup.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:python:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: lint
  script:
    - uv sync
    - uv run ruff check .

lint:frontend:
  image: oven/bun:latest
  stage: lint
  script:
    - bun install
    - bun x biome check .

test:python:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: test
  script:
    - uv sync
    - uv run pytest app/__tests__/

test:frontend:
  image: oven/bun:latest
  stage: test
  script:
    - bun install
    - bun run test:ui:unit --run

# Renovate dependency updates for GitLab.
# Runs the official renovate image as a scheduled (or manual) pipeline; config lives in renovate.json.
renovate:
  image: renovate/renovate:latest
  stage: renovate
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_TOKEN: $SETTINGS__GITLAB_ACCESS_TOKEN
    GITHUB_COM_TOKEN: $SETTINGS__GITHUB_ACCESS_TOKEN
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
