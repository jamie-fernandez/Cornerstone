workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - setup
  - lint
  - test
  - build
  - renovate

merge-request:setup:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: setup
  script:
    - python .gitlab/merge-request-setup.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:python:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: lint
  script:
    - uv sync
    - uv run ruff check .

lint:frontend:
  image: oven/bun:latest
  stage: lint
  script:
    - bun install
    - bun x biome check .

test:python:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  stage: test
  script:
    - uv sync
    - uv run pytest app/__tests__/

test:frontend:
  image: oven/bun:latest
  stage: test
  script:
    - bun install
    - bun run test:ui:unit --run

# Dry-run production builds: verify the app builds on every push, per OS.
# No `artifacts:` key on purpose — build output is discarded with the runner.
# macOS is built manually on a local Mac (hosted macOS runners need a paid tier).
.dry-run:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

build:dry-run:linux:
  extends: .dry-run
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    # binutils provides objdump, which PyInstaller requires on Linux.
    - apt-get update && apt-get install -y --no-install-recommends curl unzip binutils
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    # --ignore-scripts skips lifecycle scripts (e.g. Cypress's postinstall, which
    # the build doesn't need); build-critical native deps ship prebuilt binaries.
    - bun install --ignore-scripts
    - uv sync
    # Run the build steps directly (not `bash commands/build`) so a failed
    # PyInstaller step fails the job — the wrapper script exits 0 regardless.
    - bun run vite build
    - uv run commands/build-pyinstaller.py

# Windows hosted runner uses PowerShell and can't set `image:`.
