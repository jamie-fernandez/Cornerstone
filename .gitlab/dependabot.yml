version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      major:
        update-types:
          - "major"
      minor:
        update-types:
          - "minor"
      patch:
        update-types:
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      major:
        update-types:
          - "major"
      minor:
        update-types:
          - "minor"
      patch:
        update-types:
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "pre-commit"
    groups:
      major:
        update-types:
          - "major"
      minor:
        update-types:
          - "minor"
      patch:
        update-types:
          - "patch"
