[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[project]
name = "cornerstone"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "platformdirs==4.11.3",
    "psutil==7.2.2",
    "pywebview==6.2.1",
    "rich==15.0.0",
    "sqlalchemy==2.0.52",
    "typer==0.27.1",
]

[project.scripts]
cornerstone = "cli:app"
stone = "cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.00",
    "pre-commit==4.6.1",
    "pyinstaller==6.21.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.app]
# Single source of truth for the app's human-facing identity.
# `[project].name`/`version` above are the package slug and version; this is the
# display name used for the window title, the built executable, and the macOS
# bundle. Run `just init "My App"` to set all of these in one step.
display-name = "Cornerstone"
